
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login | PR Education Hub</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f1f5f9;
 color:#172554;
}
header{
 background:#123b70;
 color:white;
 text-align:center;
 padding:22px 12px;
}
header h1{margin:0;font-size:27px}
header p{margin:8px 0 0}
.container{
 width:min(100% - 24px,850px);
 margin:25px auto;
}
.panel{
 background:white;
 padding:24px;
 border-radius:18px;
 box-shadow:0 5px 22px #00000012;
 margin-bottom:20px;
}
h2{text-align:center;margin-top:0}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:16px;
}
.option{
 min-height:145px;
 border:3px solid #dbeafe;
 border-radius:16px;
 background:white;
 font-size:22px;
 font-weight:bold;
 color:#123b70;
 cursor:pointer;
 padding:20px 10px;
}
.option small{
 display:block;
 font-size:14px;
 font-weight:normal;
 margin-top:12px;
}
.option.selected{
 border-color:#16a34a;
 background:#f0fdf4;
}
.stream-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.medium-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.plan{
 border:2px solid #dbeafe;
 border-radius:14px;
 padding:18px;
 margin:12px 0;
 cursor:pointer;
}
.plan.selected{
 border-color:#16a34a;
 background:#f0fdf4;
}
.price{
 font-size:27px;
 font-weight:bold;
 color:#15803d;
}
input{
 width:100%;
 padding:14px;
 border:1px solid #cbd5e1;
 border-radius:10px;
 font-size:17px;
 margin:8px 0 15px;
}
.action{
 width:100%;
 padding:15px;
 border:0;
 border-radius:10px;
 background:#123b70;
 color:white;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
.muted{text-align:center;color:#64748b;font-size:14px}
.hidden{display:none}
@media(max-width:520px){
 .panel{padding:17px}
 .option{min-height:125px;font-size:19px}
 .stream-grid{grid-template-columns:1fr}
 header h1{font-size:23px}
}
</style>
</head>
<body>

<header>
<h1>PR Education Hub</h1>
<p>Learn Today • Lead Tomorrow</p>
<p>Student Registration & Premium Membership</p>
</header>

<main class="container">

<section class="panel">
<h2>Select Your Class</h2>
<div class="grid">
<button class="option" onclick="chooseClass('10')">
10th
<small>Class 10</small>
</button>
<button class="option" onclick="chooseClass('12')">
12th
<small>Class 12</small>
</button>
</div>
</section>

<section class="panel hidden" id="mediumPanel">
<h2>Select Medium</h2>
<div class="grid medium-grid" id="mediumOptions"></div>
</section>

<section class="panel hidden" id="streamPanel">
<h2>Select Your Stream</h2>
<div class="grid stream-grid">
<button class="option" onclick="chooseStream('Science')">Science</button>
<button class="option" onclick="chooseStream('Commerce')">Commerce</button>
<button class="option" onclick="chooseStream('Arts')">Arts</button>
</div>
</section>

<section class="panel hidden" id="planPanel">
<h2>Premium Membership Plan</h2>
<div id="planOptions"></div>
<p class="muted">Membership अवधि: 6 महीने</p>
</section>


<section class="panel hidden" id="studentPanel">
<h2>Student Details & Mobile Login</h2>

<label>Student Name</label>
<input id="studentName" placeholder="अपना पूरा नाम लिखें">

<label>Mobile Number</label>
<input id="mobile" type="tel" maxlength="10"
inputmode="numeric" placeholder="10 अंकों का मोबाइल नंबर">

<button class="action" id="sendOtpBtn" type="button">
Send Mobile OTP
</button>

<div id="recaptcha-container"></div>

<div id="otpArea" class="hidden">
<label>Enter OTP</label>
<input id="studentOtp" type="text"
inputmode="numeric" maxlength="6"
placeholder="6 Digit OTP">

<button class="action" id="verifyOtpBtn" type="button">
Verify OTP & Login
</button>
</div>

<p id="otpMessage" class="muted"></p>
</section>

</main>

<script>
let selectedClass="";
let selectedMedium="";
let selectedStream="";
let selectedPlan="";

function show(id){
 document.getElementById(id).classList.remove("hidden");
}

function hide(id){
 document.getElementById(id).classList.add("hidden");
}

function chooseClass(cls){
 selectedClass=cls;
 selectedMedium="";
 selectedStream="";
 selectedPlan="";

 hide("mediumPanel");
 hide("streamPanel");
 hide("planPanel");
 hide("studentPanel");

 if(cls==="10"){
  document.getElementById("mediumOptions").innerHTML=`
   <button class="option" onclick="chooseMedium('Hindi')">Hindi Medium</button>
   <button class="option" onclick="chooseMedium('English')">English Medium</button>`;
  show("mediumPanel");
 }else{
  show("streamPanel");
 }
}

function chooseStream(stream){
 selectedStream=stream;
 document.getElementById("mediumOptions").innerHTML=`
  <button class="option" onclick="chooseMedium('Hindi')">Hindi Medium</button>
  <button class="option" onclick="chooseMedium('English')">English Medium</button>`;
 show("mediumPanel");
}

function chooseMedium(medium){
 selectedMedium=medium;
 selectedPlan=selectedClass==="10"
  ? "Class 10 Premium - ₹99"
  : "Class 12 "+selectedStream+" Premium - ₹99";

 let plans=`
 <div class="plan selected" onclick="choosePlan('${selectedPlan}',this)">
  <b>${selectedPlan}</b>
  <div class="price">₹99</div>
  <small>6 Months • ${selectedMedium} Medium</small>
 </div>`;

 plans+=`
 <div class="plan" onclick="choosePlan('Combo Membership - ₹149',this)">
  <b>Combo Membership</b>
  <div class="price">₹149</div>
  <small>6 Months • Class 10 + Class 12 All Streams • Hindi + English</small>
 </div>`;

 document.getElementById("planOptions").innerHTML=plans;
 show("planPanel");
 show("studentPanel");
}

function choosePlan(plan,element){
 selectedPlan=plan;
 document.querySelectorAll(".plan").forEach(p=>p.classList.remove("selected"));
 element.classList.add("selected");
}

function continueToOTP(){
 const name=document.getElementById("studentName").value.trim();
 const mobile=document.getElementById("mobile").value.trim();

 if(!name){
  alert("कृपया Student Name लिखें।");
  return;
 }
 if(!/^[6-9]\d{9}$/.test(mobile)){
  alert("सही 10 अंकों का Mobile Number डालें।");
  return;
 }

 alert("चयन पूरा हुआ। अगला चरण Firebase OTP Verification और सुरक्षित Payment Verification जोड़ना है।");
}
</script>
 
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCM9nXyDrp6mLzTJALkpJyIq4ebm_lD1f8",
  authDomain: "pr-education-hub.firebaseapp.com",
  projectId: "pr-education-hub",
  storageBucket: "pr-education-hub.firebasestorage.app",
  messagingSenderId: "907993736868",
  appId: "1:907993736868:web:b7c098a10914a61ceca831",
  measurementId: "G-V61NSSNFRQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let confirmationResult = null;
let recaptchaVerifier = null;
let currentUser = null;

await setPersistence(auth, browserLocalPersistence);

onAuthStateChanged(auth, (user) => {
  currentUser = user;

  if (user) {
    document.getElementById("otpMessage").textContent =
      "आप पहले से Login हैं: " + user.phoneNumber;
    document.getElementById("sendOtpBtn").textContent = "Already Logged In";
    document.getElementById("sendOtpBtn").disabled = true;
  }
});

document.getElementById("sendOtpBtn").addEventListener("click", async () => {
  const name = document.getElementById("studentName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const message = document.getElementById("otpMessage");

  if (!name) {
    message.textContent = "कृपया विद्यार्थी का नाम लिखें।";
    return;
  }

  if (!/^[6-9]\d{9}$/.test(mobile)) {
    message.textContent = "कृपया सही 10 अंकों का मोबाइल नंबर लिखें।";
    return;
  }

  try {
    message.textContent = "OTP भेजा जा रहा है...";

    if (!recaptchaVerifier) {
      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        { size: "normal" }
      );
    }

    await recaptchaVerifier.render();

    confirmationResult = await signInWithPhoneNumber(
      auth,
      "+91" + mobile,
      recaptchaVerifier
    );

    document.getElementById("otpArea").classList.remove("hidden");
    message.textContent = "OTP भेज दिया गया है। अपना OTP दर्ज करें।";

  } catch (error) {
    console.error(error);
    message.textContent = "OTP नहीं भेजा जा सका: " + error.message;
  }
});

document.getElementById("verifyOtpBtn").addEventListener("click", async () => {
  const name = document.getElementById("studentName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const otp = document.getElementById("studentOtp").value.trim();
  const message = document.getElementById("otpMessage");

  if (!confirmationResult) {
    message.textContent = "पहले OTP भेजें।";
    return;
  }

  if (!/^\d{6}$/.test(otp)) {
    message.textContent = "6 अंकों का सही OTP दर्ज करें।";
    return;
  }

  try {
    message.textContent = "OTP Verify हो रहा है...";

    const result = await confirmationResult.confirm(otp);
    currentUser = result.user;

    await setDoc(doc(db, "students", currentUser.uid), {
      name: name,
      phoneNumber: "+91" + mobile,
      updatedAt: serverTimestamp()
    }, { merge: true });

    message.textContent = "Login सफल! आपका मोबाइल नंबर Verify हो गया है।";

  } catch (error) {
    console.error(error);
    message.textContent = "OTP Verification असफल: " + error.message;
  }
});
</script>
</body>
</html>

</body>
</html>
